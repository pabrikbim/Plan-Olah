<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Generator Plan Shift</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ec;--sf:#fff;--ink:#16231d;--mut:#5d6b63;--ac:#0f6b4f;--acx:#fff;--ln:#cbd3cb;--bub:#dcf3d4;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101814;--sf:#17221c;--ink:#e4ede7;--mut:#93a499;--ac:#4fc596;--acx:#0c1812;--ln:#2b3a32;--bub:#1f3d2d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101814;--sf:#17221c;--ink:#e4ede7;--mut:#93a499;--ac:#4fc596;--acx:#0c1812;--ln:#2b3a32;--bub:#1f3d2d;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;font-weight:600;margin:0 0 2px}
.sub{color:var(--mut);margin:0 0 18px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:20px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:8px 10px}
textarea{resize:vertical;min-height:64px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;line-height:1.5}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.sh{display:flex;gap:8px}
.sh input{font-weight:600}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);padding:8px 12px}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:500}
button.on{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:500}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{padding:4px 10px;font-size:13px;color:var(--mut)}
.prev{position:sticky;top:calc(12px + env(safe-area-inset-top,0px))}
@media (max-width:820px){.prev{position:static}}
.bub{background:var(--bub);border-radius:8px;padding:12px 14px;white-space:pre-wrap;word-break:break-word;max-height:60vh;overflow:auto;font-size:14px}
.ck{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:0 12px}
.cb{display:flex;align-items:center;gap:8px;margin:0;padding:5px 0;font-size:14px;color:var(--ink);cursor:pointer}
.cb input{width:auto;margin:0;accent-color:var(--ac)}
#st{min-height:22px;color:var(--ac);font-size:13px;margin-top:6px}
.hint{font-size:13px;color:var(--mut);margin:8px 0 0}
</style>
</head>
<body>
<div class="wrap">
<h1>Generator Plan Shift</h1>
<p class="sub">Isi data hari ini, teks WhatsApp tersusun otomatis. Data tersimpan di browser ini.</p>
<div class="grid">
<div>
<div class="card">
<label for="tgl" style="margin-top:0">Tanggal plan</label>
<input type="date" id="tgl">
<div class="row" style="margin-top:10px"><button id="fri" aria-pressed="false">Opsi hari Jumat</button></div>
<p class="hint" id="friHint"></p>
</div>
<div id="secs"></div>
<div class="row" style="margin:0 0 12px"><button id="addSec">Tambah seksi</button></div>
<div class="card">
<label for="cbc" style="margin-top:0">Start CBC (jam)</label>
<input type="text" id="cbc" inputmode="decimal" placeholder="contoh: 14.00 (kosongkan jika tidak ada)" autocomplete="off">
<label for="notes">Catatan lain (judul “Note:” otomatis)</label>
<textarea id="notes" rows="4"></textarea>
<label for="tags">Hashtag penutup</label>
<textarea id="tags" rows="5"></textarea>
</div>
</div>
<div class="prev">
<div class="card">
<div class="bub" id="out" aria-live="polite"></div>
<div class="row">
<button class="p" id="copy">Salin teks</button>
<button id="wa">Buka WhatsApp</button>
<button id="next">Hari berikutnya</button>
<button id="swapAll">Tukar semua petugas</button>
<button id="reset">Kembalikan contoh</button>
</div>
<div id="st"></div>
</div>
</div>
</div>
</div>
<script>
var KEY="planshift-v1";
var HARI=["Minggu","Senin","Selasa","Rabu","Kamis","Jum’at","Sabtu"];
var BLN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
var OM1="Masuk kembali jam 13.00, start olah jam 14.00";
function defaults(){return{
date:"2026-10-30",
fri:true,
secs:[
{t:"Timbangan",h:"TBS Inti : 07.00 - selesai\nTBS Luar : 14.00 - selesai",i:"",f:""},
{t:"Boarding System",h:"Bpk. Suriansyah : 07.00 - 15.00\nBpk. Khoirul : 15.00 - selesai",i:"",f:""},
{t:"KCP",h:"Bpk. Kiman\nShift 1 : 07.00 - 19.00\n- 07.00-12.00 :",i:"",f:"Masuk kembali jam 13.00, start ulang olah jam 14.00\n\nShift 2 : 19.00 - selesai"},
{t:"Proses",h:"Bpk. Suwanto : 07.00 - 19.00\n07.00 - 12.00 :",i:"",f:OM1+"\n\nBpk. Hardi : 19.00 - selesai"},
{t:"Boiler & WTP",h:"Bpk. Sofii : 07.00 - 19.00\n07.00 - 12.00 :",i:"",f:"Masuk kembali jam 13.00, jam 14.00 sinkron\n\nBpk. Agus : 19.00 - selesai"}
],
cbc:"14.00",
notes:"-Masing-masing shift istirahat 2 jam\n-Jika tidak ada pemberitahuan ulang, jadwal tetap",
tags:"*#ReadyToWork* ♨️\n*#SafetyFirst* 🧯\n*#FitToWork* 🩺\n*#KitaSelamat* 🥂\n*#Rendemen>20%* 🎯"};}
var CATS={"Proses":["OM Tresher","OM Vibrating press&Liquor","OM Digester","OM CBC","OM Perforated Chute","OM Ducting FC","OM Heater bank","OM HDC","OM Header Sparator","OM RBS","OM Vacum Dryer","OM Recycle tank","OM COT","OM CCT 1","OM CCT2","OM Sludge Tank","OM WOT","OM Buffer Tank","5K2S"],
"KCP":["Cleaning sediment tank","Cleaning Leaf Filter","OM/PM unit","5K2S"],
"Boiler & WTP":["OM Under grate","OM Fire grate","OM Chimny","OM Pipa SH","OM Pase 1, 2 &3","OM Dust Collector","OM Blade IDF","5K2S"]};
function fixS(){if(typeof S.fri!=="boolean")S.fri=true;
if(typeof S.cbc!=="string"){var cb="",kl=[];(S.notes||"").split("\n").forEach(function(l){if(/^[-•\s]*start\s*cbc/i.test(l.trim())){var m=l.match(/(\d{1,2}[.:]\d{2})/);if(m)cb=m[1];}else kl.push(l);});S.cbc=cb;S.notes=kl.join("\n");}S.secs.forEach(function(s){if(!s.cat||!s.cat.length){var nc=CATS[s.t]||[];if(nc.length){s.cat=nc.slice();s.i="";s.c=[];}else if(!s.cat)s.cat=[];}if(!s.c)s.c=[];});
if(S.v!==2){S.secs.forEach(function(s){if(s.cat.length){s.i="";syncI(s);}});S.v=2;}}
function norm(l){return l.trim().replace(/^[-•]\s*/,"").toLowerCase();}
/* checklist -> kotak: item terpilih (urutan checklist) + baris manual di luar checklist */
function syncI(s){
var catl=s.cat.map(function(x){return x.toLowerCase();});
var extra=s.i.split("\n").map(function(l){return l.trim();}).filter(function(l){return l&&catl.indexOf(norm(l))<0;});
s.i=s.cat.filter(function(x){return s.c.indexOf(x)>=0;}).concat(extra).join("\n");}
/* kotak -> checklist: centang item yang barisnya ada di kotak */
function pullC(s){
var ls=s.i.split("\n").map(norm).filter(Boolean);
s.c=s.cat.filter(function(x){return ls.indexOf(x.toLowerCase())>=0;});}
var S;
try{S=JSON.parse(localStorage.getItem(KEY));}catch(e){S=null;}
if(!S||!S.secs)S=defaults();
fixS();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function tglText(){var p=S.date.split("-");if(p.length<3)return "";var d=new Date(+p[0],+p[1]-1,+p[2]);return HARI[d.getDay()]+", "+d.getDate()+" "+BLN[d.getMonth()]+" "+d.getFullYear();}
function build(){
var o="*[Plan Shift "+tglText()+"]*\n\n";
S.secs.forEach(function(s){
o+="*"+s.t+"*\n";
if(s.h.trim())o+=s.h.trim()+"\n";
var fr=s.i.split("\n").map(function(l){return l.trim().replace(/^[-•]\s*/,"");}).filter(Boolean);
var it0=(s.cat||[]).filter(function(x){return (s.c||[]).indexOf(x)>=0;}).concat(fr);
var it=it0.filter(function(x,n){return it0.findIndex(function(y){return y.toLowerCase()===x.toLowerCase();})===n;});
if(it.length)o+="*Plan OM*\n"+it.map(function(l){return "- "+l;}).join("\n")+"\n";
if(s.f.trim())o+="\n"+s.f.trim()+"\n";
o+="\n";});
var nl=[];
if(S.cbc&&S.cbc.trim())nl.push("-Start CBC  *Jam "+S.cbc.trim()+"*");
if(S.notes.trim())nl.push(S.notes.trim());
if(nl.length)o+="*Note:*\n"+nl.join("\n")+"\n\n";
if(S.tags.trim())o+="\n"+S.tags.trim();
return o.replace(/\n{3,}/g,"\n\n").trim();}
function preview(){
var t=build();
document.getElementById("out").innerHTML=esc(t).replace(/\*([^*\n]+)\*/g,"<b>$1</b>");
save();return t;}
function renderSecs(){
document.getElementById("secs").innerHTML=S.secs.map(function(s,n){
return '<div class="card" data-n="'+n+'"><div class="sh"><input data-k="t" value="'+esc(s.t)+'" aria-label="Nama seksi"><button data-a="up" aria-label="Naikkan">↑</button><button data-a="dn" aria-label="Turunkan">↓</button><button data-a="del">Hapus</button></div>'
+'<label>Petugas dan jam (satu baris per orang)</label><textarea data-k="h" rows="3">'+esc(s.h)+'</textarea><div class="row" style="margin:6px 0 0"><button class="p" data-a="swap">⇄ Tukar petugas</button><span class="chip det">'+det(s)+'</span></div>'
+ckHtml(s)+'<label>'+(s.cat&&s.cat.length?"Plan OM (terisi otomatis dari checklist, bisa ditambah manual)":"Plan OM")+' (satu baris per pekerjaan)</label><textarea data-k="i" rows="4">'+esc(s.i)+'</textarea>'
+'<div class="row" style="margin:6px 0 0"><button class="chip" data-a="add" data-v="5K2S">+ 5K2S</button><button class="chip" data-a="add" data-v="OM/PM unit">+ OM/PM unit</button></div>'
+'<label>Teks setelah Plan OM (jam masuk kembali, shift berikutnya)</label><textarea data-k="f" rows="3">'+esc(s.f)+'</textarea></div>';}).join("");}
var NOSWAP="Tidak ada 2 petugas berformat ‘Bpk. Nama : jam’ di seksi ini.";
function ckHtml(s){if(!s.cat||!s.cat.length)return "";
return '<label>Checklist Plan OM</label><div class="ck">'+s.cat.map(function(x,j){return '<label class="cb"><input type="checkbox" data-ck="'+j+'"'+((s.c||[]).indexOf(x)>=0?' checked':'')+'> '+esc(x)+'</label>';}).join("")+'</div><div class="row" style="margin:6px 0 0"><button class="chip" data-a="all">Pilih semua</button><button class="chip" data-a="none">Kosongkan</button></div>';}
var OPRE=/^((?:Bpk|Ibu|Pak|Bu|Sdr)\.?\s+[^:]+?)\s*:\s*(\d{1,2}[.:]\d{2}\s*-\s*.+)$/i;
function det(s){var c=0;(s.h+"\n"+s.f).split("\n").forEach(function(l){if(OPRE.test(l.trim()))c++;});return c>=2?c+" petugas terdeteksi":"Belum ada 2 petugas berformat ‘Bpk. Nama : jam’";}
function swapOps(s){
var re=/^((?:Bpk|Ibu|Pak|Bu|Sdr)\.?\s+[^:]+?)\s*:\s*(\d{1,2}[.:]\d{2}\s*-\s*.+)$/i;
var L={h:s.h.split("\n"),f:s.f.split("\n")},R=[];
["h","f"].forEach(function(k){L[k].forEach(function(l,ix){var m=l.trim().match(re);if(m)R.push({k:k,ix:ix,name:m[1].trim(),time:m[2]});});});
if(R.length<2)return false;
R.forEach(function(r,n){var p=R[(n+R.length-1)%R.length];L[r.k][r.ix]=p.name+" : "+r.time;});
s.h=L.h.join("\n");s.f=L.f.join("\n");return true;}

/* ---- Opsi hari Jumat ---- */
var RNG=/^[-•\s]*\d{1,2}[.:]\d{2}\s*-\s*\d{1,2}[.:]\d{2}\s*:?\s*$/;
var PAGI=/:\s*0?7[.:]00\s*-\s*19[.:]00/;
function setFri(s,on){
if(/timbangan/i.test(s.t)){
s.h=s.h.split("\n").map(function(l){
var x=l.trim();
if(/^TBS\s+Inti\s*:/i.test(x))return "TBS Inti : 07.00 - selesai";
if(/^TBS\s+Luar\s*:/i.test(x))return "TBS Luar : "+(on?"14.00":"07.00")+" - selesai";
return l;}).join("\n");
return;}
if(!PAGI.test(s.h))return;
if(!on){
var keep=[];
s.h.split("\n").forEach(function(l){if(RNG.test(l.trim()))s.frH=l;else keep.push(l);});
s.h=keep.join("\n").replace(/\s+$/,"");
var kf=[];
s.f.split("\n").forEach(function(l){if(/^masuk kembali/i.test(l.trim()))s.frF=l.trim();else kf.push(l);});
s.f=kf.join("\n").replace(/^\s+/,"");
}else{
var has=s.h.split("\n").some(function(l){return RNG.test(l.trim());});
if(!has)s.h=s.h.replace(/\s+$/,"")+"\n"+(s.frH||"07.00 - 12.00 :");
var hasF=s.f.split("\n").some(function(l){return /^masuk kembali/i.test(l.trim());});
if(!hasF)s.f=(s.frF||OM1)+(s.f.trim()?"\n\n"+s.f.trim():"");
}}
function friUi(){
var b=document.getElementById("fri");
b.className=S.fri?"on":"";
b.setAttribute("aria-pressed",S.fri?"true":"false");
b.textContent=S.fri?"Opsi hari Jumat: AKTIF":"Opsi hari Jumat";
document.getElementById("friHint").textContent=S.fri?"Mode Jumat: shift pagi 07.00 - 12.00 dan masuk kembali 13.00 - 19.00, lalu shift malam 19.00 - selesai.":"Mode hari biasa: shift pagi 07.00 - 19.00 dan shift malam 19.00 - selesai.";}
function setMode(on){
if(S.fri!==on){S.secs.forEach(function(s){setFri(s,on);});S.fri=on;}
friUi();renderSecs();preview();}
function autoMode(){var p=S.date.split("-");if(p.length<3)return;var d=new Date(+p[0],+p[1]-1,+p[2]);if(isNaN(d))return;var on=d.getDay()===5;if(on!==S.fri){setMode(on);say(on?"Hari Jumat: mode Jumat diaktifkan.":"Bukan hari Jumat: mode hari biasa diaktifkan.");}}
document.getElementById("fri").onclick=function(){setMode(!S.fri);say(S.fri?"Mode Jumat aktif.":"Mode hari biasa aktif.");};

document.getElementById("secs").addEventListener("input",function(e){
var c=e.target.closest(".card"),k=e.target.dataset.k;if(!c||!k)return;
var sx=S.secs[+c.dataset.n];sx[k]=e.target.value;var d=c.querySelector(".det");if(d)d.textContent=det(sx);
if(k==="i"&&sx.cat&&sx.cat.length){pullC(sx);c.querySelectorAll("[data-ck]").forEach(function(cb){cb.checked=sx.c.indexOf(sx.cat[+cb.dataset.ck])>=0;});}
preview();});
document.getElementById("secs").addEventListener("click",function(e){
var b=e.target.closest("button"),c=e.target.closest(".card");if(!b||!c)return;
var n=+c.dataset.n,a=b.dataset.a;
if(a==="del"){S.secs.splice(n,1);}
else if(a==="up"&&n>0){S.secs.splice(n-1,0,S.secs.splice(n,1)[0]);}
else if(a==="dn"&&n<S.secs.length-1){S.secs.splice(n+1,0,S.secs.splice(n,1)[0]);}
else if(a==="all"){S.secs[n].c=(S.secs[n].cat||[]).slice();syncI(S.secs[n]);}
else if(a==="none"){S.secs[n].c=[];syncI(S.secs[n]);}
else if(a==="swap"){say(swapOps(S.secs[n])?"Petugas ditukar, jam tetap.":NOSWAP);}
else if(a==="add"){var s=S.secs[n];if(s.i.split("\n").map(function(x){return x.trim();}).indexOf(b.dataset.v)<0)s.i=(s.i.trim()?s.i.replace(/\n+$/,"")+"\n":"")+b.dataset.v;if(s.cat&&s.cat.length){pullC(s);syncI(s);}}
renderSecs();preview();});
document.getElementById("secs").addEventListener("change",function(e){var j=e.target.dataset.ck,c=e.target.closest(".card");if(j===undefined||!c)return;var s=S.secs[+c.dataset.n],x=s.cat[+j];s.c=s.c||[];var p=s.c.indexOf(x);if(e.target.checked&&p<0)s.c.push(x);else if(!e.target.checked&&p>=0)s.c.splice(p,1);syncI(s);var ta=c.querySelector('textarea[data-k="i"]');if(ta)ta.value=s.i;preview();});
document.getElementById("addSec").onclick=function(){S.secs.push({t:"Seksi baru",h:"",i:"",f:""});fixS();renderSecs();preview();};
document.getElementById("tgl").oninput=function(e){S.date=e.target.value;preview();autoMode();};
document.getElementById("cbc").oninput=function(e){S.cbc=e.target.value;preview();};
document.getElementById("notes").oninput=function(e){S.notes=e.target.value;preview();};
document.getElementById("tags").oninput=function(e){S.tags=e.target.value;preview();};
function say(m){var el=document.getElementById("st");el.textContent=m;setTimeout(function(){el.textContent="";},2500);}
document.getElementById("copy").onclick=function(){
var t=build();
function fb(){var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");say("Tersalin. Tempel di WhatsApp.");}catch(e){say("Gagal menyalin. Blok teks pratinjau lalu salin manual.");}document.body.removeChild(ta);}
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){say("Tersalin. Tempel di WhatsApp.");},fb);}else fb();};
document.getElementById("wa").onclick=function(){window.open("https://wa.me/?text="+encodeURIComponent(build()),"_blank","noopener");};
document.getElementById("next").onclick=function(){
var p=S.date.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]+1);
S.date=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
document.getElementById("tgl").value=S.date;preview();say("Tanggal maju satu hari. Perbarui Plan OM bila perlu.");autoMode();};
document.getElementById("swapAll").onclick=function(){var c=0;S.secs.forEach(function(s){if(swapOps(s))c++;});renderSecs();preview();say(c?"Petugas di "+c+" seksi ditukar, jam tetap.":NOSWAP);};
document.getElementById("reset").onclick=function(){S=defaults();fixS();init();say("Contoh dikembalikan.");};
function init(){
document.getElementById("tgl").value=S.date;
document.getElementById("cbc").value=S.cbc;
document.getElementById("notes").value=S.notes;
document.getElementById("tags").value=S.tags;
friUi();renderSecs();preview();}
init();
</script>
</body>
</html>
